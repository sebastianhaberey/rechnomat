customer: "meier-gmbh"  # references a Customer file by its filename stem
layout: # invoice rendering options
  template: "de-DE"  # selects the template directory under templates/
  render_bank_details: true  # show the seller's bank details on the invoice
  render_notes: true  # show the notes field on the invoice
  render_return_address_line: true  # show the small return-address line above the recipient address, for window envelopes
  background: "letterhead.pdf"  # file under backgrounds/ merged behind the content, leave empty for none
issue_date: 2026-08-15  # invoice issue date (EN 16931 BT-2)
payment_terms_days: 14  # days from issue_date until due_date
currency: "EUR"  # (ISO 4217) (EN 16931 BT-5)
buyer_reference: "AR/0815"  # reference assigned by the buyer for internal routing (EN 16931 BT-10)
line_items: # invoice line items (EN 16931 BG-25)
  - description: "Arbeitsstunden"  # line item description (EN 16931 BT-153)
    quantity: "50"  # quantity (EN 16931 BT-129)
    unit: "HUR"  # UN/ECE Recommendation 20 unit code, e.g. "HUR", "EA" (EN 16931 BT-130)
    unit_price_net: "13.90"  # net unit price (EN 16931 BT-146)
    vat_rate: "19"  # percent (EN 16931 BT-152)
