[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rechnomat"
version = "0.0.0"
description = "Create invoices compliant with German E-Rechnung laws"
readme = "README.md"
requires-python = ">=3.14"

license = "MIT"

authors = [
    { name = "Sebastian Haberey", email = "sebastian@haberey.com" }
]

dependencies = [
    "click==8.4.2",
    "cloup==3.1.0",
    "pydantic==2.13.4",
    "rich==15.0.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/sebastianhaberey/rechnomat"
Repository = "https://github.com/sebastianhaberey/rechnomat"
"Bug Tracker" = "https://github.com/sebastianhaberey/rechnomat/issues"
Changelog = "https://github.com/sebastianhaberey/rechnomat/blob/main/CHANGELOG.md"

[project.scripts]
rechnomat = "rechnomat.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tools"]

[tool.ruff.lint]
select = [
    "E", # Pycodestyle (basic errors)
    "F", # Pyflakes (unused imports, etc.)
    "W", # Warnings
    "I", # Import sorting (isort behavior)
    "UP", # pyupgrade: e.g., prefer dict[str, int] over Dict[str, int]
]

[tool.ruff.format]
quote-style = "double"
